[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litecast"
dynamic = ["version"]
description = "Peer-to-peer weight distribution with optional LiteRegistry discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "P2P Weight Transfer", email = "felix@primeintellect.ai"}]
dependencies = ["blake3>=1.0.5"]

[project.optional-dependencies]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]
registry = ["literegistry", "redis>=5"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "numpy", "safetensors"]

[project.scripts]
litecast-origin = "litecast.origin_server:main"
litecast-middle = "litecast.middle_node:main"
litecast-client = "litecast.client_node:main"
litecast-registry-middle = "litecast.registry.middle:main"

[tool.setuptools.dynamic]
version = {attr = "litecast.__version__"}

[tool.setuptools.packages.find]
include = ["litecast*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"litecast/__init__.py" = ["F401"]
